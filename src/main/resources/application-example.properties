spring.application.name=spring-ai-learning

app.ai.provider=google-genai
app.ai.model=gemini-2.5-flash-lite
app.ai.profile=fast

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY:${GEMINI_API_KEY:}}
spring.ai.google.genai.chat.model=${app.ai.model}
spring.ai.google.genai.chat.temperature=0.2

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false

spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10s
spring.ai.retry.on-client-errors=false
